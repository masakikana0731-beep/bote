<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<title>ボート予想くん</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>🚤 ボート予想くん</h1>
  <div id="budget" class="budget"></div>
  <div id="automode" class="automode hidden"></div>
</header>

<nav>
  <button data-tab="today" class="active">今日</button>
  <button data-tab="settings">設定</button>
  <button data-tab="stats">成績</button>
</nav>

<main>
  <section id="tab-today">
    <div id="error" class="error hidden"></div>
    <h2>買い目</h2>
    <div id="recs"></div>
    <h2>このあとのレース</h2>
    <p class="hint">締切の数分前に自動で予想して通知します。「今すぐ予想」で手動でもOK。</p>
    <div id="upcoming"></div>
    <h2>自動購入の記録</h2>
    <div id="buylog"></div>
  </section>

  <section id="tab-settings" class="hidden">
    <form id="settings-form">
      <fieldset>
        <legend>🤖 自動投資</legend>
        <label>モード
          <select name="auto_mode">
            <option value="off">オフ（通知だけ・自分で買う）</option>
            <option value="paper">仮想（お金を使わず自動で買ったことにする）</option>
            <option value="real">本番（テレボートで自動購入）</option>
          </select>
        </label>
        <p id="real-note" class="hint"></p>
      </fieldset>

      <fieldset>
        <legend>💰 お金（安全装置）</legend>
        <label>1日の最大投資額（円）<input type="number" name="daily_budget" step="100" min="0"></label>
        <label>1レースの上限（円）<input type="number" name="race_budget" step="100" min="100"></label>
        <label>1日の最大参加レース数<input type="number" name="max_races_per_day" min="1" max="200"></label>
      </fieldset>

      <fieldset>
        <legend>🎲 スタイル</legend>
        <div class="slider" data-name="gamble" data-left="本命党" data-right="大穴狙い">ギャンブル性</div>
        <div class="slider" data-name="selectivity" data-left="どんどん参加" data-right="自信がある時だけ">厳選度</div>
        <div class="slider" data-name="crowd" data-left="独自予想" data-right="人気に乗る">人気(オッズ)をどれだけ信じるか</div>
        <div class="slider" data-name="whim" data-left="きっちり" data-right="気まぐれ">気まぐれ度</div>
        <label>1レースの点数（上限）<input type="number" name="tickets" min="1" max="20"></label>
        <label>金額の配分
          <select name="allocation">
            <option value="dutch">どれが当たっても払戻が近くなる</option>
            <option value="equal">均等</option>
            <option value="prob">当たりやすい目に厚く</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>🔍 何を重視する？</legend>
        <div class="slider" data-name="w_course" data-left="無視" data-right="重視">コース（イン有利）</div>
        <div class="slider" data-name="w_national" data-left="無視" data-right="重視">選手の全国勝率</div>
        <div class="slider" data-name="w_local" data-left="無視" data-right="重視">当地勝率</div>
        <div class="slider" data-name="w_motor" data-left="無視" data-right="重視">モーター</div>
        <div class="slider" data-name="w_exhibit" data-left="無視" data-right="重視">展示タイム</div>
        <div class="slider" data-name="w_start" data-left="無視" data-right="重視">スタート</div>
      </fieldset>

      <fieldset>
        <legend>⚙️ その他</legend>
        <label>締切の何分前に予想するか<input type="number" name="lead_minutes" min="2" max="30"></label>
        <div class="label">対象の場（未選択＝全場）</div>
        <div id="venues" class="venues"></div>
        <label class="check"><input type="checkbox" name="enabled"> 自動予想をON</label>
      </fieldset>

      <button type="submit" class="primary">保存</button>
      <span id="saved" class="hint"></span>
    </form>
  </section>

  <section id="tab-stats" class="hidden">
    <p class="hint">「実際」は購入済みにしたレースのみ。「仮想」は推奨を全部買っていた場合。</p>
    <div id="stats"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
